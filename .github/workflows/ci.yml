# CI: lint, typecheck, semua test (shared, web, API dengan Postgres+Redis, e2e Playwright),
# lalu build & push image ke GHCR (hanya branch main). Deploy tetap manual: scripts/deploy.sh <sha> di server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.3'

jobs:
  quality:
    name: Lint, typecheck, unit test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @indotek/shared build
      - run: pnpm --filter @indotek/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @indotek/shared test
      - run: pnpm --filter @indotek/web test

  api-test:
    name: Test API (Postgres 16 + Redis 7)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env: { POSTGRES_USER: indotek, POSTGRES_PASSWORD: indotek, POSTGRES_DB: indotek_budget }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U indotek" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://indotek:indotek@localhost:5432/indotek_budget_test?schema=public
      REDIS_TEST_URL: redis://localhost:6379
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @indotek/shared build
      - run: pnpm --filter @indotek/api test

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env: { POSTGRES_USER: indotek, POSTGRES_PASSWORD: indotek, POSTGRES_DB: indotek_budget }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U indotek" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/report, retention-days: 7 }

  images:
    name: Build & push image (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, api-test, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: indotek-api, context: ., dockerfile: apps/api/Dockerfile.prod }
          - { name: indotek-web, context: ., dockerfile: apps/web/Dockerfile.prod }
          - { name: indotek-backup, context: docker/backup, dockerfile: docker/backup/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Ringkasan
        run: echo "Image ${{ matrix.name }}:${{ steps.meta.outputs.sha }} — deploy di server dengan ./scripts/deploy.sh ${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
