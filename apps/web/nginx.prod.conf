# nginx production (di belakang Caddy). Header keamanan dipasang di Caddy.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # aset ber-hash dari Vite → cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: index.html tidak di-cache agar rilis baru langsung terpakai
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
