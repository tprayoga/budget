# Stack PRODUCTION Indotek Budget.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Hanya Caddy yang membuka port ke publik (80/443). Postgres & Redis hanya di network internal.
name: indotek

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/OWNER/indotek-web}:${TAG:-latest}
    restart: unless-stopped
    networks: [edge]
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp]
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/indotek-api}:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGIN: https://${DOMAIN}
      TRUST_PROXY_HOPS: '1'
      COOKIE_SECURE: 'true'
    volumes:
      - uploads:/app/storage/uploads
    networks: [edge, backend]
    mem_limit: ${API_MEM_LIMIT:-1536m}
    logging: *logging

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    mem_limit: 2g
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory', '200mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 256m
    logging: *logging

  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/OWNER/indotek-backup}:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      POSTGRES_HOST: postgres
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    volumes:
      - uploads:/uploads
      - backup_state:/state
      - backup_cache:/cache
    # backend: akses postgres; egress: kirim ke object storage
    networks: [backend, egress]
    mem_limit: 512m
    logging: *logging

  # ---- hanya untuk uji lokal backup/restore (profile backup-test): S3-compatible lokal
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    profiles: ['backup-test']
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    networks: [egress]
    volumes:
      - miniodata:/data

networks:
  edge:
  backend:
    internal: true
  egress:

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
  backup_state:
  backup_cache:
  miniodata:
